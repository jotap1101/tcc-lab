# Fonte única de verdade de configuração do projeto (carregada por src/config.py).
project:
  name: "tcc"

aoi:
  region_code: "310044"  # Região Geográfica Imediata de Guaxupé (IBGE)
  vector_source: "ibge_mesh"  # malha vetorial do IBGE (versão 2025, MG)
  mesh_path: "data/external/ibge/mg_rg_immediatas_2025/mg_rg_immediatas_2025.shp"  # versionada no repo

data:
  collection: "COPERNICUS/S2_SR_HARMONIZED"
  bands: ["B2", "B3", "B4", "B8"]
  dates:
    # Ano/mosaico padrão do pipeline — usado como fallback apenas para fontes de
    # ground truth sem `year` próprio (todas as habilitadas hoje declaram `year`).
    start: "2023-01-01"
    end: "2023-12-31"
  cloud_threshold: 20  # porcentagem máxima de nuvens (QA60)
  patch_size: 512
  coffee_min_ratio: 0.0
  # Fração mínima de pixels válidos (não-NaN) para manter um patch. Descarta
  # patches totalmente fora do AOI, que só adicionariam fundo artificial ao
  # treino e à validação; pixels inválidos restantes são ignorados por perda e
  # métricas (rótulo -1) no dataset.
  min_valid_fraction: 0.10
  crs: "EPSG:31983"  # SIRGAS 2000 / UTM 23S (zona UTM da RGI de Guaxupé)
  export:
    scale: 10  # resolução nativa das bandas B2/B3/B4/B8 (10 m)
    max_pixels: 100000000  # acima dos ~58.7M pixels do AOI (10 m) para a exportação não falhar

ground_truth:
  # Cada fonte é integrada em uma célula de código própria e armazenada em uma
  # subpasta própria sob MyDrive/tcc/data/interim/<fonte>. Cada fonte declara o
  # `year` mais recente com dados disponíveis (definido nesta configuração):
  # MapBiomas 2025 (Coleção 11), AlphaEarth/FDaP 2024 (modelo 2025b) e Emater
  # 2018 (parque cafeeiro validado em campo). O ano próprio de cada fonte define
  # o mosaico/composite/patches correspondentes.
  # `chosen_source` é a DECISÃO MANUAL do pesquisador: o sistema não elege fonte
  # alguma — o estágio 03 compara todas as fontes e o estágio 04 apenas registra
  # a escolha. A fonte escolhida determina apenas qual conjunto de patches será
  # usado no treinamento (estágios 09/10); os patches existem para todas as fontes.
  chosen_source: "emater"
  sources:
    mapbiomas:
      enabled: true
      # Coleção consolidada do MapBiomas (cobre 1985–2025); filtra pela coleção
      # (`collection_filter`, 11 = Coleção 11) e pelo ano. Fallback documentado:
      # collection_filter 10 com year 2024 (Coleção 10) se a 11 ainda não estiver
      # no asset consolidado ao executar.
      collection_id: "projects/mapbiomas-public/assets/brazil/lulc/v1"
      collection_filter: 11
      year: 2025
      coffee_class: 46  # classe 3.2.2.1 Café (banda "classification")
      # Resolução nativa (30 m — Landsat). A exportação do GEE reamostra (nearest)
      # para o grid de 10 m do Sentinel-2 (config.data.export.scale).
      native_resolution_m: 30
    alphaearth:
      enabled: true
      # Forest Data Partnership, modelo 2025b (embeddings AlphaEarth Foundations),
      # cobertura pantropical 2017–2024 — ano mais recente disponível da fonte.
      collection_id: "projects/forestdatapartnership/assets/coffee/model_2025b"
      probability_threshold: 0.28  # limiar inicial para a 2025b; recalibrar na validação
      year: 2024
      native_resolution_m: 10
    emater:
      # Fonte vetorial (não-GEE): glebas de café do Geoportal do Café (Emater-MG),
      # mapeamento do parque cafeeiro concluído em 2018, validado em campo. Os
      # GeoJSONs por município ficam em data/external/emater/ (versionados e
      # entregues ao runtime pelo bootstrap). O ano próprio (2018) define o
      # mosaico/composite correspondente.
      enabled: true
      kind: "vector"
      year: 2018
      data_dir: "data/external/emater"
      native_resolution_m: 10  # rasterizada diretamente no grid de 10 m do AOI

gee:
  project: "articulate-case-508513-m4"  # ID do projeto Cloud do Earth Engine

secrets:
  # Dataset privado do Kaggle anexado aos notebooks como input; o fallback de
  # get_secret lê os tokens em /kaggle/input/<slug>/ sem anexar Secrets por notebook.
  kaggle_dataset: "jotap1101kaggle/tcc-secrets"

storage:
  drive_root: "tcc"  # pasta canônica na raiz do Google Drive (MyDrive/<drive_root>)
  subfolders:
    data_raw: "data/raw"
    data_raw_sentinel2: "data/raw/sentinel2"
    data_interim: "data/interim"
    data_processed: "data/processed"
    data_processed_composites: "data/processed/composites"
    data_processed_patches: "data/processed/patches"
    data_external: "data/external"
    models: "models"
    artifacts_metrics: "artifacts/metrics"
    artifacts_metrics_ground_truth: "artifacts/metrics/ground_truth"
    artifacts_figures: "artifacts/figures"
    artifacts_xai: "artifacts/xai"
    artifacts_runs: "artifacts/runs"
    secrets: "secrets"
    repo: "repo"  # espelho do código-fonte (src/) usado como entrega ao runtime

splits:
  fold_count: 5

loss:
  dice_weight: 1.0
  focal_weight: 1.0
  boundary_weight: 1.0

model:
  unet_channels: [32, 64, 128, 256]
  segformer_variant: "nvidia/mit-b1"

augmentation:
  # Aumentações geométricas determinísticas aplicadas ao par (imagem, máscara)
  # durante o treino (mesmo protocolo nos estágios 09/10). O RNG é reseedado
  # por época com seed + fold + época; com num_workers=0 o treino é
  # bit-reproduzível (aumentações dependem do gerador local do processo).
  enabled: true
  hflip_prob: 0.5
  vflip_prob: 0.5
  rot90_prob: 0.25

training:
  lr: 1.0e-4
  epochs: 100
  batch_size: 16
  weight_decay: 1.0e-4
  num_workers: 0  # 0 garante determinismo bit-a-bit das aumentações e da carga

reproducibility:
  seed: 42