[project]
name = "tcc"
version = "0.1.0"
description = "Segmentação semântica de lavouras cafeeiras: análise comparativa U-Net (CNN) vs SegFormer (ViT)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "rasterio",
    "earthengine-api",
    "geopandas",
    "huggingface-hub",
    "transformers",
    "torch",
    "torchvision",
    "google-api-python-client",
    "google-auth-oauthlib",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "kaggle>=1.7.4.5",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
